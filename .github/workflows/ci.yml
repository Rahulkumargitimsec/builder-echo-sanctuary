name: GridSense CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.22.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests and frontend build
        run: pnpm test

  container-validation:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate production Compose configuration
        run: POSTGRES_PASSWORD=ci-password JWT_SECRET=ci-secret docker compose -f docker-compose.prod.yml config
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t gridsense-backend:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t gridsense-frontend:ci .
