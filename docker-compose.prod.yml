services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gridsense
      POSTGRES_USER: gridsense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - gridsense-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridsense -d gridsense"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://gridsense:${POSTGRES_PASSWORD}@database:5432/gridsense
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      database:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gridsense-postgres-data:
